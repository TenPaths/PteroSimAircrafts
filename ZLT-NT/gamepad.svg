<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="820" height="440" fill="#ffffff"/>

  <!-- triggers and bumpers, drawn first so the body overlaps their feet -->
  <g stroke="#2f353d" stroke-width="2">
    <rect x="258" y="104" width="64" height="30" rx="10" fill="#c9cfd7"/>
    <rect x="498" y="104" width="64" height="30" rx="10" fill="#c9cfd7"/>
    <rect x="258" y="130" width="64" height="20" rx="6" fill="#aeb6c0"/>
    <rect x="498" y="130" width="64" height="20" rx="6" fill="#aeb6c0"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#1c2126" text-anchor="middle">
    <text x="290" y="123">LT</text>
    <text x="530" y="123">RT</text>
    <text x="290" y="145">LB</text>
    <text x="530" y="145">RB</text>
  </g>

  <!-- body: a DualSense from the front, grips swept down and out -->
  <path d="M280 148 C330 138 490 138 540 148 C575 152 598 200 606 262
           C614 322 590 354 562 352 C540 350 522 322 508 298
           C480 308 340 308 312 298 C298 322 280 354 258 352
           C230 354 206 322 214 262 C222 200 245 152 280 148 Z"
        fill="#dfe4ea" stroke="#2f353d" stroke-width="2.5"/>

  <!-- touchpad, create, options, PS -->
  <rect x="355" y="158" width="110" height="52" rx="10" fill="#c9cfd7" stroke="#2f353d" stroke-width="2"/>
  <rect x="337" y="175" width="9" height="20" rx="4" fill="#aeb6c0" stroke="#2f353d" stroke-width="1.6"/>
  <rect x="474" y="175" width="9" height="20" rx="4" fill="#8fa8d8" stroke="#2f353d" stroke-width="1.6"/>
  <circle cx="410" cy="262" r="9" fill="#aeb6c0" stroke="#2f353d" stroke-width="1.6"/>

  <!-- d-pad -->
  <g fill="#aeb6c0" stroke="#2f353d" stroke-width="2">
    <rect x="292" y="183" width="16" height="44" rx="4"/>
    <rect x="278" y="197" width="44" height="16" rx="4"/>
  </g>

  <!-- face buttons, numbered the generic way: 1 square, 2 cross, 3 circle, 4 triangle -->
  <g stroke="#2f353d" stroke-width="2">
    <circle cx="520" cy="182" r="11" fill="#aeb6c0"/>
    <circle cx="543" cy="205" r="11" fill="#aeb6c0"/>
    <circle cx="520" cy="228" r="11" fill="#8fa8d8"/>
    <circle cx="497" cy="205" r="11" fill="#8fa8d8"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#1c2126" text-anchor="middle">
    <text x="497" y="209">1</text>
    <text x="520" y="232">2</text>
    <text x="543" y="209">3</text>
    <text x="520" y="186">4</text>
  </g>

  <!-- sticks -->
  <g stroke="#2f353d" stroke-width="2.5">
    <circle cx="355" cy="268" r="24" fill="#c6ccd4"/>
    <circle cx="355" cy="268" r="14" fill="#9aa3ad"/>
    <circle cx="465" cy="268" r="24" fill="#c6ccd4"/>
    <circle cx="465" cy="268" r="14" fill="#9aa3ad"/>
  </g>

  <!-- leaders -->
  <g stroke="#5b636d" stroke-width="1.6" fill="none">
    <path d="M258 119 H160"/>
    <path d="M562 119 H660"/>
    <path d="M331 268 H200 V280"/>
    <path d="M489 268 H620 V280"/>
    <path d="M531 230 H660"/>
    <path d="M478 175 V70"/>
  </g>

  <!-- labels -->
  <g font-size="15" fill="#1c2126">
    <text x="154" y="115" text-anchor="end">LT</text>
    <text x="154" y="133" text-anchor="end" fill="#4d5560">nacelles up / down</text>

    <text x="154" y="292" text-anchor="end">left stick</text>
    <text x="154" y="310" text-anchor="end" fill="#4d5560">up / down: throttle</text>
    <text x="154" y="328" text-anchor="end" fill="#4d5560">left / right: yaw</text>

    <text x="668" y="115">RT</text>
    <text x="668" y="133" fill="#4d5560">same as LT, either one</text>

    <text x="668" y="225">buttons 1 / 2</text>
    <text x="668" y="243" fill="#4d5560">ballonets: vent / fill</text>

    <text x="668" y="292">right stick</text>
    <text x="668" y="310" fill="#4d5560">up / down: elevator</text>

    <text x="478" y="48" text-anchor="middle">Options</text>
    <text x="478" y="66" text-anchor="middle" fill="#4d5560">stop</text>
  </g>

  <text x="410" y="412" font-size="13" fill="#4d5560" text-anchor="middle">
    Throttle and nacelles hold where you leave them; the sticks spring back to centre.
  </text>
</svg>
